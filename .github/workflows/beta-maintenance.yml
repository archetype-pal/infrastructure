name: Beta maintenance

# Runs one fixed maintenance task on the beta host over the deploy key, for when
# no personal key can log in. The task list is closed on purpose: the input only
# selects a command defined below, it never reaches the shell itself.
# - status: container health, the Python version in api/celery, a Celery ping.
# - reindex: `just reindex` (recreate the Meilisearch indexes, then sync them all).
# - authorize-admin-keys: add any key in ssh/beta-admin-keys.pub that is missing
#   from root's authorized_keys. It only appends; it never removes a key.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run on the beta host"
        required: true
        type: choice
        options: [status, reindex, authorize-admin-keys]

permissions:
  contents: read

# Shares the deploy group so a task never overlaps a deploy.
concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run task over SSH
        env:
          SSH_KEY: ${{ secrets.BETA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BETA_KNOWN_HOSTS }}
          HOST: ${{ vars.BETA_HOST }}
          TASK: ${{ inputs.task }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          status='docker compose ps --format "table {{.Service}}\t{{.Status}}"
            && docker compose exec -T api python --version
            && docker compose exec -T celery python --version
            && docker compose exec -T celery celery -A config inspect ping'
          case "$TASK" in
            status) remote="$status" ;;
            # `docker compose run` reads stdin; detach it as deploy.sh does.
            reindex) remote="just reindex </dev/null && $status" ;;
            # Matches on the key body, so a key already present under another
            # comment is not added twice. The pull picks up a freshly merged file.
            authorize-admin-keys) remote='git pull --ff-only -q
              && install -m 700 -d /root/.ssh && touch /root/.ssh/authorized_keys
              && chmod 600 /root/.ssh/authorized_keys
              && { [ -z "$(tail -c1 /root/.ssh/authorized_keys)" ] || echo >> /root/.ssh/authorized_keys; }
              && grep -v -e "^#" -e "^$" ssh/beta-admin-keys.pub | while read -r type key comment; do
                if grep -qF " $key" /root/.ssh/authorized_keys; then echo "present: $comment";
                else echo "$type $key $comment" >> /root/.ssh/authorized_keys; echo "added: $comment"; fi; done
              && echo "$(grep -c "^ssh-" /root/.ssh/authorized_keys) keys in authorized_keys"' ;;
            *) echo "Unknown task: $TASK" >&2; exit 1 ;;
          esac
          ssh "root@$HOST" "cd /srv/archetype/infrastructure && ${remote//$'\n'/ }"
