name: Deploy beta

# Deploys to the beta host (beta.archetype-pal.ink) over SSH.
# - push to main: config in this repo changed; redeploy with the latest images.
# - repository_dispatch (image-published): the backend and frontend CD workflows
#   send this right after they push an image (they need an INFRA_DISPATCH_TOKEN
#   secret with contents:write on this repo). No-op if the pins are unchanged.
# - schedule: the fallback for an image published without a dispatch. GitHub
#   runs cron jobs late during busy periods, and the top of the hour is the
#   busiest, so the minutes are offset; expect runs hours apart, not every 15
#   minutes. GitHub disables schedules after 60 days without repo activity;
#   re-enable in the Actions tab.
# - workflow_dispatch: deploy on demand, optionally pinning explicit images (rollback).
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [image-published]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      backend_image:
        description: "Backend image (default: newest :latest, pinned by digest)"
        required: false
      frontend_image:
        description: "Frontend image (default: newest :beta, pinned by digest)"
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve image pins
        env:
          BACKEND_INPUT: ${{ inputs.backend_image }}
          FRONTEND_INPUT: ${{ inputs.frontend_image }}
        run: |
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          backend="${BACKEND_INPUT:-ghcr.io/archetype-pal/backend@$(digest ghcr.io/archetype-pal/backend:latest)}"
          frontend="${FRONTEND_INPUT:-ghcr.io/archetype-pal/frontend@$(digest ghcr.io/archetype-pal/frontend:beta)}"
          echo "BACKEND=$backend" >> "$GITHUB_ENV"
          echo "FRONTEND=$frontend" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.BETA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BETA_KNOWN_HOSTS }}
          HOST: ${{ vars.BETA_HOST }}
          MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && '--if-changed' || '' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "root@$HOST" \
            "git -C /srv/archetype/infrastructure pull --ff-only -q && /srv/archetype/infrastructure/scripts/deploy.sh '$BACKEND' '$FRONTEND' $MODE"
