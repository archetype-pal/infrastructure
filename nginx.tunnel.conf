# nginx config for CLOUDFLARE TUNNEL deployments.
#
# Use this instead of nginx.conf when the origin sits behind `cloudflared`
# rather than being exposed directly on 80/443. Cloudflare terminates TLS at
# the edge and the tunnel speaks plain HTTP to this container, so there is no
# ssl_certificate here and no 80 -> 443 redirect (that redirect would loop
# forever behind the tunnel: the edge is already HTTPS, so every redirect
# arrives back as another plain-HTTP request).
#
# Selected via compose.tunnel.yaml, which mounts this file over the template
# path and publishes the HTTP listener on ${NGINX_HTTP_PORT}. Certbot is not
# used in this mode.
#
# Everything below mirrors nginx.conf's routing exactly — only the TLS/redirect
# layer differs. Keep the two in sync when adding routes.

server {
    listen 80;
    server_name ${DOMAIN};

    # Allow full-resolution manuscript image uploads (SIPI max_post_size = 300M).
    # nginx defaults to a 1M client body, which would 413 admin/API image uploads
    # before they ever reach Django/SIPI.
    client_max_body_size 300M;

    # Cloudflare terminated TLS, so the scheme the user actually used is https
    # even though this hop is http. Django reads this via SECURE_PROXY_SSL_HEADER
    # to build absolute URLs (IIIF manifest `id`, canvas ids, image services) and
    # to satisfy SECURE_SSL_REDIRECT. Hardcoded rather than $scheme: $scheme is
    # "http" on this hop and would make Django emit http:// URLs and then
    # redirect-loop.
    location ~ ^/(admin|static|media|api|tinymce) {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SIPI control/admin/test routes must never be reachable from the public
    # internet. The vendored sipi.config.lua ships demo routes including
    # `GET /api/exit` (shuts SIPI down — unauthenticated DoS), `POST /api/upload`,
    # `DELETE /api/cache`, the `/luaexe/*` and `/test/*` Lua execution demos, the
    # `/sqlite` test route, and the `/server` fileserver docroot. Deny them all at
    # the proxy so only read-only IIIF image requests pass through.
    location ~ ^/sipi/(api|luaexe|server|test|sqlite)(/|$) {
        return 404;
    }

    # IIIF image delivery only. Restrict to read-only methods so the public proxy
    # can never reach a SIPI write/control route even if one is added upstream.
    location /sipi {
        limit_except GET HEAD {
            deny all;
        }
        # Do NOT rewrite away the /sipi prefix, and do NOT force Host: localhost.
        # SIPI builds the `id` in info.json from the Host header + the request
        # path it actually receives. Stripping the prefix and pinning the host
        # made it advertise `https://localhost/images/foo.jpg` — a URL no client
        # can fetch, which silently breaks every IIIF viewer (they derive all
        # tile requests from `id`, not from the URL they asked for).
        #
        # Passing /sipi through instead makes `sipi` SIPI's prefix segment, so
        # with prefix_as_path the file resolves under <imgroot>/sipi/... — hence
        # the image_server mount at /sipi/images/sipi in compose.yaml. The id
        # then comes back as https://$host/sipi/<identifier>, which round-trips.
        proxy_pass http://image_server:1024;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
