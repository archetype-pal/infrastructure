map $http_access_control_request_headers $sipi_cors_allow_headers {
    ""      "Accept, Content-Type, Range, If-Modified-Since, Cache-Control, X-Requested-With";
    default $http_access_control_request_headers;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name ${DOMAIN};

    # SSL certificate configuration
    ssl_certificate /etc/nginx/certs/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/${DOMAIN}/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow full-resolution manuscript image uploads (SIPI max_post_size = 300M).
    # nginx defaults to a 1M client body, which would 413 admin/API image uploads
    # before they ever reach Django/SIPI. The backend's UPLOADS_CHUNK_SIZE
    # (default 100M) must stay below this, or every chunk PUT is refused here.
    client_max_body_size 300M;

    location ~ ^/(admin|static|media|api|tinymce) {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SIPI control/admin/test routes must never be reachable from the public
    # internet. The vendored sipi.config.lua ships demo routes including
    # `GET /api/exit` (shuts SIPI down — unauthenticated DoS), `POST /api/upload`,
    # `DELETE /api/cache`, the `/luaexe/*` and `/test/*` Lua execution demos, the
    # `/sqlite` test route, and the `/server` fileserver docroot. Deny them all at
    # the proxy so only read-only IIIF image requests pass through.
    location ~ ^/sipi/(api|luaexe|server|test|sqlite)(/|$) {
        return 404;
    }

    # IIIF image delivery only. Restrict to read-only methods so the public proxy
    # can never reach a SIPI write/control route even if one is added upstream.
    location /sipi {
        limit_except GET HEAD OPTIONS {
            deny all;
        }

        # Viewers that send Cache-Control/Range on info.json trigger a preflight;
        # answer it here rather than forwarding OPTIONS to SIPI.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers $sipi_cors_allow_headers always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0 always;
            return 204;
        }
        # /sipi must reach SIPI unrewritten and with the real Host: SIPI builds
        # info.json's `id` from both, and clients derive every tile URL from `id`.
        # Media therefore mounts at /sipi/images/sipi (see compose.yaml).
        proxy_pass http://image_server:1024;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
