# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name ${DOMAIN};

    # SSL certificate configuration
    ssl_certificate /etc/nginx/certs/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/${DOMAIN}/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow full-resolution manuscript image uploads (SIPI max_post_size = 300M).
    # nginx defaults to a 1M client body, which would 413 admin/API image uploads
    # before they ever reach Django/SIPI.
    client_max_body_size 300M;

    location ~ ^/(admin|static|media|api|tinymce) {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SIPI control/admin/test routes must never be reachable from the public
    # internet. The vendored sipi.config.lua ships demo routes including
    # `GET /api/exit` (shuts SIPI down — unauthenticated DoS), `POST /api/upload`,
    # `DELETE /api/cache`, the `/luaexe/*` and `/test/*` Lua execution demos, the
    # `/sqlite` test route, and the `/server` fileserver docroot. Deny them all at
    # the proxy so only read-only IIIF image requests pass through.
    location ~ ^/sipi/(api|luaexe|server|test|sqlite)(/|$) {
        return 404;
    }

    # IIIF image delivery only. Restrict to read-only methods so the public proxy
    # can never reach a SIPI write/control route even if one is added upstream.
    location /sipi {
        limit_except GET HEAD {
            deny all;
        }
        # Do NOT rewrite away the /sipi prefix, and do NOT force Host: localhost.
        # SIPI builds info.json's `id` from the Host header plus the path it
        # actually receives, so stripping the prefix and pinning the host made it
        # advertise `https://localhost/images/foo.jpg` — unfetchable. IIIF clients
        # derive every tile request from `id`, not from the URL they asked for, so
        # this silently broke Mirador/UV even though info.json itself returned 200.
        #
        # Passing /sipi through makes `sipi` SIPI's prefix segment, which with
        # prefix_as_path resolves under <imgroot>/sipi/... — hence the image_server
        # mount at /sipi/images/sipi in compose.yaml. Keep the two in step.
        proxy_pass http://image_server:1024;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
