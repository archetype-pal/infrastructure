name: archetype
services:
  meilisearch:
    image: getmeili/meilisearch:v1.50.0
    restart: unless-stopped
    environment:
      # MEILI_MASTER_KEY and MEILISEARCH_API_KEY live in env_file and must match.
      # Don't list the master key here — an `environment:` entry overrides
      # env_file and interpolates to empty, which 500s every search.
      - MEILI_ENV=${MEILI_ENV:-development}
      # Migrate the on-disk index format in place when the image is bumped to a
      # newer Meilisearch. Without this, a version mismatch makes the server
      # refuse to start. No-op when versions already match. Safe — no embedders.
      - MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE=true
    env_file: env_file
    # No host `ports:` — Meilisearch is reachable only over the internal compose
    # network (the api/celery containers use http://meilisearch:7700). Exposing
    # it on the host would let anyone with network access read/write/delete every
    # index.
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    # Stay on the bookworm (glibc 2.36) base: the data dir's collation was
    # created with 2.36, and the trixie base (glibc 2.41) triggers a collation
    # version mismatch that would force a REINDEX. The postgres image isn't
    # CVE-scanned by CD, so a newer base buys nothing here.
    image: ${POSTGRES_IMAGE:-postgres:18.4-bookworm}
    restart: unless-stopped
    volumes:
      # PostgreSQL 18 Docker images use versioned PGDATA under /var/lib/postgresql.
      # Keep the volume mounted at the parent so future major upgrades can use
      # the official versioned layout.
      - postgres18:/var/lib/postgresql
    environment:
      - POSTGRES_HOST=localhost
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-local}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - PGDATA=/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    # Pin to an immutable release tag (override BACKEND_IMAGE in env to roll
    # forward/back). Mutable :latest makes `docker compose pull` silently change
    # the running version and defeats digest-based rollback.
    image: ${BACKEND_IMAGE:-ghcr.io/archetype-pal/backend:latest}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      MEILISEARCH_URL: http://meilisearch:7700
    env_file: env_file
    volumes:
      - ./storage:/app/storage
      # Media is bind-mounted separately (over the ./storage subpath above) so a
      # deployment can keep the 30GB image corpus outside the infrastructure
      # checkout. Defaults to the in-repo path, so existing deploys are unchanged.
      - ${MEDIA_HOST_PATH:-./storage/media}:/app/storage/media
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The api image is minimal; use Python (always present) rather than
      # assuming curl/wget. Any HTTP response (even a 4xx HTTPError) from the
      # schema endpoint proves the WSGI app is up and routing; a connection
      # refusal (process not serving) raises URLError and fails the check.
      # urllib raises HTTPError on 4xx/5xx, so swallow it via contextlib.suppress.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,urllib.error,contextlib; exec(\"with contextlib.suppress(urllib.error.HTTPError): urllib.request.urlopen('http://127.0.0.1:80/api/v1/schema/', timeout=5)\")"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  frontend:
    # Run the baked image, pinned via env (override FRONTEND_IMAGE to roll
    # forward/back). The previous prod stack shipped a mutable `:dev` tag AND
    # bind-mounted `../frontend:/app` over the image, coupling the running
    # container to the host's frontend checkout (and its node_modules). The
    # source bind-mount belongs in a dev override file, not here.
    image: ${FRONTEND_IMAGE:-ghcr.io/archetype-pal/frontend:latest}
    restart: unless-stopped
    env_file: env_file
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  image_server:
    image: daschswiss/sipi:v5.0.1
    restart: unless-stopped
    user: "14:50"
    # SIPI has no internal memory cap and has been OOM-killed while rendering
    # large images. With a container limit the kernel kills (and compose
    # restarts) only SIPI, instead of host-wide OOM taking down other services.
    mem_limit: 2g
    # SIPI's Lua config reads these via os.getenv(): override the stock demo
    # jwt_secret / admin credentials and the production loglevel. Leaving them
    # unset falls back to the vendored demo values (still denied at the nginx
    # proxy). See env_file.example.
    environment:
      - SIPI_JWT_SECRET=${SIPI_JWT_SECRET:-}
      - SIPI_ADMIN_USER=${SIPI_ADMIN_USER:-}
      - SIPI_ADMIN_PASSWORD=${SIPI_ADMIN_PASSWORD:-}
      - SIPI_LOGLEVEL=${SIPI_LOGLEVEL:-}
    # No host `ports:` — SIPI is reached only via nginx (`location /sipi`) and the
    # internal compose network. Publishing 1024 on the host bypasses the nginx
    # route-denial that blocks SIPI's control routes (/api/exit, /api/upload, ...).
    expose:
      - "1024"
    volumes:
      # Mounted one level deeper than imgroot (./images) on purpose: nginx passes
      # the /sipi prefix through untouched so SIPI can echo it back in info.json's
      # `id`, and with prefix_as_path that makes `sipi` a real directory segment
      # under imgroot. Stripping the prefix instead made SIPI advertise
      # unfetchable `https://localhost/...` ids and broke every IIIF viewer.
      - ${MEDIA_HOST_PATH:-./storage/media}:/sipi/images/sipi
      - ./sipi-config/sipi.config.lua:/sipi/config/sipi.config.lua:ro
      - ./sipi-config/sipi.init.lua:/sipi/config/sipi.init.lua:ro
    healthcheck:
      # CMD (exec) form, not CMD-SHELL: this image ships no /bin/sh, so every
      # shell-form probe died with "exec: /bin/sh: no such file or directory"
      # and the container sat permanently unhealthy. curl is present.
      #
      # No -f: SIPI answers / with 400 and /server/ with 404 (both are "the
      # process is serving"), and -f would turn those into failures. Bare curl
      # exits 0 on any HTTP response and non-zero only when the connection is
      # refused — exactly the liveness signal we want. 127.0.0.1, not localhost:
      # localhost resolves to ::1 first here and SIPI binds IPv4.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:1024/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: env_file
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
      - ./html:/var/www/certbot:ro
      - ./nginx-entrypoint.sh:/docker-entrypoint.d/nginx-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.d/nginx-entrypoint.sh"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Confirm nginx answers on the HTTP listener. The `/` location returns a
      # 301 → HTTPS, so we grep the response headers for an "HTTP/" status line:
      # any reply (incl. the 3xx) means nginx is serving. busybox wget on alpine
      # exits non-zero on a 3xx, so we ignore its exit code and check the output.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1/ 2>&1 | grep -q 'HTTP/'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  certbot:
    image: certbot/certbot:v5.6.0
    volumes:
      - ./certs:/etc/letsencrypt
      - ./html:/var/www/certbot
      - ./logs:/var/log/letsencrypt
    depends_on:
      - nginx
  # ftp:
  #   image: fauria/vsftpd
  #   restart: always
  #   env_file: env_file
  #   ports:
  #     - "21:21"
  #     - "21100-21110:21100-21110"
  #   volumes:  # make sure to update archetype_user below to match the user in the env_file 
  #     - ./storage/media:/home/vsftpd/archetype_user

  redis:
    # Pinned exactly rather than to the floating `8-alpine` tag, which silently
    # walked 8.0 -> 8.8 in place and made deploys non-reproducible.
    image: redis:8.8.1-alpine
    restart: unless-stopped
    # Require a password (set REDIS_PASSWORD in env_file). No host `ports:` —
    # Redis is reachable only over the internal compose network by api/celery.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file: env_file
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 30s
      retries: 50

  celery:
    image: ${BACKEND_IMAGE:-ghcr.io/archetype-pal/backend:latest}
    restart: unless-stopped
    command: celery -A config worker -l info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    env_file: env_file
    environment:
      # Redis now requires a password; include it in the broker/result URLs.
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      # The image-upload ingest task (apps.uploads) ends by requesting a real
      # tile from SIPI to prove the converted JP2 is servable. IIIF_HOST in
      # env_file is the BROWSER-facing address, which this container cannot
      # reach — the worker must talk to SIPI over the internal compose network.
      - UPLOADS_SIPI_BASE_URL=http://image_server:1024
    volumes:
      # The upload ingest pipeline runs on this worker: it reads chunk files
      # from storage/uploads_tmp/, writes the served JP2 under storage/media/
      # and archives the original under storage/originals/. Same mount as the
      # api service — without it every upload fails at the conversion step.
      - ./storage:/app/storage
    # `inspect ping` is Celery's canonical liveness probe — it round-trips
    # through the broker and the worker's mingle queue, so a green check
    # means "worker is consuming tasks", not just "process exists". `-d`
    # targets THIS container's worker name; `$$HOSTNAME` is escaped so
    # docker-compose passes a literal `$HOSTNAME` for the shell to expand
    # inside the container.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Periodic logical backup of the application database. Runs in-process
  # (no host cron / no Kubernetes CronJob assumed) and writes compressed
  # dumps to a host-mounted `./backups/` directory so operators can pull
  # them off the box without entering the container.
  #
  # Retention: 14 days. Schedule: once every 24h after a one-minute warm-up
  # so a stack restart doesn't immediately re-dump.
  #
  # See infrastructure/docs/backup-runbook.md for restore steps and the
  # off-site copy policy.
  pg_backup:
    image: postgres:18-alpine
    env_file: env_file
    command:
      - sh
      - -c
      - |
        set -eu
        sleep 60
        mkdir -p /backups
        while true; do
          ts="$$(date -u +%Y%m%dT%H%M%SZ)"
          out="/backups/local-$$ts.sql.gz"
          echo "[pg_backup] starting dump → $$out"
          if pg_dump "$$DATABASE_URL" | gzip > "$$out.partial"; then
            mv "$$out.partial" "$$out"
            echo "[pg_backup] OK $$(wc -c < "$$out") bytes"
          else
            echo "[pg_backup] FAILED — leaving .partial for inspection" >&2
            rm -f "$$out.partial" || true
          fi
          find /backups -name 'local-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres18:
  logs:
  meilisearch_data:
  redis_data:
