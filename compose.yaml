name: archetype
services:
  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    restart: unless-stopped
    environment:
      # MEILI_MASTER_KEY and MEILISEARCH_API_KEY live in env_file and must match.
      # Don't list the master key here — an `environment:` entry overrides
      # env_file and interpolates to empty, which 500s every search.
      - MEILI_ENV=${MEILI_ENV:-development}
      # Migrate the on-disk index format in place when the image is bumped to a
      # newer Meilisearch. Without this, a version mismatch makes the server
      # refuse to start. No-op when versions already match. Safe: the only
      # embedder, `glyph` on the graphs index (AI programme branch only), holds
      # copies of vectors kept in Postgres and calls no model, and
      # `just sync-search-index graphs` rebuilds it.
      # Meilisearch 1.55 ignores the old MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE name.
      - MEILI_UPGRADE_DB=true
    env_file: env_file
    # No host `ports:` — Meilisearch is reachable only over the internal compose
    # network (the api/celery containers use http://meilisearch:7700). Exposing
    # it on the host would let anyone with network access read/write/delete every
    # index.
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    # Stay on the bookworm (glibc 2.36) base: the data dir's collation was
    # created with 2.36, and the trixie base (glibc 2.41) triggers a collation
    # version mismatch that would force a REINDEX. The postgres image isn't
    # CVE-scanned by CD, so a newer base buys nothing here.
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    restart: unless-stopped
    volumes:
      # PostgreSQL 18 Docker images use versioned PGDATA under /var/lib/postgresql.
      # Keep the volume mounted at the parent so future major upgrades can use
      # the official versioned layout.
      - postgres18:/var/lib/postgresql
    environment:
      - POSTGRES_HOST=localhost
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-local}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - PGDATA=/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    # Pin to an immutable release tag (override BACKEND_IMAGE in env to roll
    # forward/back). Mutable :latest makes `docker compose pull` silently change
    # the running version and defeats digest-based rollback.
    image: ${BACKEND_IMAGE:-ghcr.io/archetype-pal/backend:latest}
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      MEILISEARCH_URL: http://meilisearch:7700
      # Server-to-server SIPI address for info.json probes (IIIF manifest canvas
      # sizes). IIIF_HOST in env_file is the BROWSER-facing address; from inside
      # this container it either hairpins through nginx or fails, and every
      # failure costs the manifest a 5s timeout plus retry before it falls back
      # to a guessed size. Same `/sipi` prefix rule as UPLOADS_SIPI_BASE_URL on
      # the celery service below.
      IIIF_INTERNAL_HOST: http://image_server:1024/sipi
      # Proxies that append to X-Forwarded-For between the visitor and Django:
      # nginx alone (nginx.conf), or Cloudflare + nginx, which nginx.tunnel.conf
      # collapses to one entry. Unset, DRF keys LoginThrottle on the whole
      # header, which the client writes, so the throttle can be dodged.
      # Raise it only for an extra appending proxy in front (e.g. Cloudflare's
      # orange cloud over the direct nginx.conf stack). Override it in .env:
      # this `environment:` value beats anything set in env_file.
      DRF_NUM_PROXIES: ${DRF_NUM_PROXIES:-1}
    env_file: env_file
    volumes:
      - ./storage:/app/storage
      # Media is bind-mounted separately (over the ./storage subpath above) so a
      # deployment can keep the 30GB image corpus outside the infrastructure
      # checkout. Defaults to the in-repo path, so existing deploys are unchanged.
      - ${MEDIA_HOST_PATH:-./storage/media}:/app/storage/media
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The api image is minimal; use Python (always present) rather than
      # assuming curl/wget. Any HTTP response (even a 4xx HTTPError) from the
      # schema endpoint proves the WSGI app is up and routing; a connection
      # refusal (process not serving) raises URLError and fails the check.
      # urllib raises HTTPError on 4xx/5xx, so swallow it via contextlib.suppress.
      # X-Forwarded-Proto: https stops SECURE_SSL_REDIRECT from bouncing the probe to https.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,urllib.error,contextlib; exec(\"with contextlib.suppress(urllib.error.HTTPError): urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:80/api/v1/schema/', headers={'X-Forwarded-Proto': 'https'}), timeout=5)\")"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  frontend:
    # Run the baked image, pinned via env (override FRONTEND_IMAGE to roll
    # forward/back). The previous prod stack shipped a mutable `:dev` tag AND
    # bind-mounted `../frontend:/app` over the image, coupling the running
    # container to the host's frontend checkout (and its node_modules). The
    # source bind-mount belongs in a dev override file, not here.
    image: ${FRONTEND_IMAGE:-ghcr.io/archetype-pal/frontend:latest}
    restart: unless-stopped
    env_file: env_file
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  image_server:
    image: daschswiss/sipi:v10.0.0  # keep in lockstep with backend/compose.yaml; see docs/sipi.md
    restart: unless-stopped
    user: "14:50"
    # SIPI has no internal memory cap and has been OOM-killed while rendering
    # large images. With a container limit the kernel kills (and compose
    # restarts) only SIPI, instead of host-wide OOM taking down other services.
    mem_limit: 2g
    # SIPI's Lua config reads these via os.getenv(): override the stock demo
    # jwt_secret / admin credentials and the production loglevel. Leaving them
    # unset falls back to the vendored demo values (still denied at the nginx
    # proxy). See env_file.example.
    environment:
      - SIPI_JWT_SECRET=${SIPI_JWT_SECRET:-}
      - SIPI_ADMIN_USER=${SIPI_ADMIN_USER:-}
      - SIPI_ADMIN_PASSWORD=${SIPI_ADMIN_PASSWORD:-}
      - SIPI_LOGLEVEL=${SIPI_LOGLEVEL:-}
    # No host `ports:` — SIPI is reached only via nginx (`location /sipi`) and the
    # internal compose network. Publishing 1024 on the host bypasses the nginx
    # route-denial that blocks SIPI's control routes (/api/exit, /api/upload, ...).
    expose:
      - "1024"
    volumes:
      # Mounted one level deeper than imgroot (./images) on purpose: nginx passes
      # the /sipi prefix through untouched so SIPI can echo it back in info.json's
      # `id`, and with prefix_as_path that makes `sipi` a real directory segment
      # under imgroot. Stripping the prefix instead made SIPI advertise
      # unfetchable `https://localhost/...` ids and broke every IIIF viewer.
      - ${MEDIA_HOST_PATH:-./storage/media}:/sipi/images/sipi
      - ./sipi-config/sipi.config.lua:/sipi/config/sipi.config.lua:ro
      - ./sipi-config/sipi.init.lua:/sipi/config/sipi.init.lua:ro
    healthcheck:
      # CMD (exec) form, not CMD-SHELL: this image ships no /bin/sh, so every
      # shell-form probe died with "exec: /bin/sh: no such file or directory"
      # and the container sat permanently unhealthy. curl is present.
      #
      # No -f: SIPI answers / with 400 and /server/ with 404 (both are "the
      # process is serving"), and -f would turn those into failures. Bare curl
      # exits 0 on any HTTP response and non-zero only when the connection is
      # refused — exactly the liveness signal we want. 127.0.0.1, not localhost:
      # localhost resolves to ::1 first here and SIPI binds IPv4.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:1024/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: env_file
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
      - ./html:/var/www/certbot:ro
      - ./nginx-entrypoint.sh:/docker-entrypoint.d/nginx-entrypoint.sh:ro
      # Served directly at /media (see nginx.conf); same corpus as api and SIPI.
      - ${MEDIA_HOST_PATH:-./storage/media}:/srv/media:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.d/nginx-entrypoint.sh"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Confirm nginx answers on the HTTP listener. The `/` location returns a
      # 301 → HTTPS, so we grep the response headers for an "HTTP/" status line:
      # any reply (incl. the 3xx) means nginx is serving. busybox wget on alpine
      # exits non-zero on a 3xx, so we ignore its exit code and check the output.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1/ 2>&1 | grep -q 'HTTP/'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  certbot:
    image: certbot/certbot:v5.8.0
    volumes:
      - ./certs:/etc/letsencrypt
      - ./html:/var/www/certbot
      - ./logs:/var/log/letsencrypt
    depends_on:
      - nginx
  # ftp:
  #   image: fauria/vsftpd
  #   restart: always
  #   env_file: env_file
  #   ports:
  #     - "21:21"
  #     - "21100-21110:21100-21110"
  #   volumes:  # make sure to update archetype_user below to match the user in the env_file 
  #     - ./storage/media:/home/vsftpd/archetype_user

  redis:
    # Pinned exactly rather than to the floating `8-alpine` tag, which silently
    # walked 8.0 -> 8.8 in place and made deploys non-reproducible.
    image: redis:8.10.1-alpine
    restart: unless-stopped
    # Require a password (set REDIS_PASSWORD in env_file). No host `ports:` —
    # Redis is reachable only over the internal compose network by api/celery.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file: env_file
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 30s
      retries: 50

  celery:
    image: ${BACKEND_IMAGE:-ghcr.io/archetype-pal/backend:latest}
    restart: unless-stopped
    command: celery -A config worker -l info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    env_file: env_file
    environment:
      # Redis now requires a password; include it in the broker/result URLs.
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      # The image server as this worker reaches it, as on the api service. The
      # palaeography tutor (AI programme W4.4) writes its lessons on this
      # worker and fetches pages and glyph crops here; unset, it falls back to
      # IIIF_HOST, the browser's address, which from this container hairpins
      # or fails.
      - IIIF_INTERNAL_HOST=http://image_server:1024/sipi
      # The image-upload ingest task (apps.uploads) ends by requesting a real
      # tile from SIPI to prove the converted JP2 is servable. IIIF_HOST in
      # env_file is the BROWSER-facing address, which this container cannot
      # reach — the worker must talk to SIPI over the internal compose network.
      #
      # The `/sipi` segment is REQUIRED and easy to lose: media is mounted at
      # /sipi/images/sipi while sipi.config.lua sets imgroot=./images with
      # prefix_as_path, so every identifier this deployment serves is prefixed
      # `sipi/`. Without it the smoke test 404s on every upload, the ingest task
      # deletes the JP2 it just converted, and the session fails — verified from
      # this container: no prefix -> 404, with prefix -> 200. The dev stack in
      # backend/compose.yaml mounts media at /sipi/images (no prefix), which is
      # why a dev-stack test cannot catch this.
      - UPLOADS_SIPI_BASE_URL=http://image_server:1024/sipi
    volumes:
      # The upload ingest pipeline runs on this worker: it reads chunk files
      # from storage/uploads_tmp/ and writes the converted JP2 under
      # storage/media/uploads/. Without this mount every upload fails at the
      # conversion step.
      - ./storage:/app/storage
      # Media must resolve to the SAME host path as api and image_server (both
      # alias it via MEDIA_HOST_PATH). With only the mount above, a deployment
      # that points MEDIA_HOST_PATH at an external corpus would have the worker
      # write into the checkout while api and SIPI read from the corpus — the
      # upload would succeed and then 404.
      - ${MEDIA_HOST_PATH:-./storage/media}:/app/storage/media
    # `inspect ping` is Celery's canonical liveness probe — it round-trips
    # through the broker and the worker's mingle queue, so a green check
    # means "worker is consuming tasks", not just "process exists". `-d`
    # targets THIS container's worker name; `$$HOSTNAME` is escaped so
    # docker-compose passes a literal `$HOSTNAME` for the shell to expand
    # inside the container.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_learn:
    # The palaeography tutor's lessons (AI programme W4.4) take minutes each and
    # anyone may start one, so they have their own queue and this worker, and
    # cannot hold up search sync or uploads. Only a build of the AI programme
    # branch (archetype-pal/backend#202) routes tasks here, so it is opt-in with
    # the tutor: `docker compose --profile learn up -d celery_learn learn_prune`.
    profiles: ["learn"]
    image: ${BACKEND_IMAGE:-ghcr.io/archetype-pal/backend:latest}
    restart: unless-stopped
    command: celery -A config worker -l info -Q learn -c 2 -n learn@%h
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    env_file: env_file
    environment:
      # Redis now requires a password; include it in the broker/result URLs.
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      # The image server as this worker reaches it, as on the api service. The
      # palaeography tutor (AI programme W4.4) writes its lessons on this
      # worker and fetches pages and glyph crops here; unset, it falls back to
      # IIIF_HOST, the browser's address, which from this container hairpins
      # or fails.
      - IIIF_INTERNAL_HOST=http://image_server:1024/sipi
      # The image-upload ingest task (apps.uploads) ends by requesting a real
      # tile from SIPI to prove the converted JP2 is servable. IIIF_HOST in
      # env_file is the BROWSER-facing address, which this container cannot
      # reach — the worker must talk to SIPI over the internal compose network.
      #
      # The `/sipi` segment is REQUIRED and easy to lose: media is mounted at
      # /sipi/images/sipi while sipi.config.lua sets imgroot=./images with
      # prefix_as_path, so every identifier this deployment serves is prefixed
      # `sipi/`. Without it the smoke test 404s on every upload, the ingest task
      # deletes the JP2 it just converted, and the session fails — verified from
      # this container: no prefix -> 404, with prefix -> 200. The dev stack in
      # backend/compose.yaml mounts media at /sipi/images (no prefix), which is
      # why a dev-stack test cannot catch this.
      - UPLOADS_SIPI_BASE_URL=http://image_server:1024/sipi
    volumes:
      # The upload ingest pipeline runs on this worker: it reads chunk files
      # from storage/uploads_tmp/ and writes the converted JP2 under
      # storage/media/uploads/. Without this mount every upload fails at the
      # conversion step.
      - ./storage:/app/storage
      # Media must resolve to the SAME host path as api and image_server (both
      # alias it via MEDIA_HOST_PATH). With only the mount above, a deployment
      # that points MEDIA_HOST_PATH at an external corpus would have the worker
      # write into the checkout while api and SIPI read from the corpus — the
      # upload would succeed and then 404.
      - ${MEDIA_HOST_PATH:-./storage/media}:/app/storage/media
    # `inspect ping` is Celery's canonical liveness probe — it round-trips
    # through the broker and the worker's mingle queue, so a green check
    # means "worker is consuming tasks", not just "process exists". `-d`
    # targets THIS container's worker name; `$$HOSTNAME` is escaped so
    # docker-compose passes a literal `$HOSTNAME` for the shell to expand
    # inside the container.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  embedder:
    # The self-hosted glyph encoder behind "letters like this" (AI programme
    # W1.2): the vision encoder of a TrOCR trained on medieval Latin, weights
    # pinned and baked in, run on CPU with the Hub switched off. Only a build of
    # the AI programme branch (archetype-pal/backend#202) calls it, so it is
    # opt-in: `docker compose --profile ml up -d embedder`, then
    # ML_EMBEDDER_URL=http://embedder:8080 in env_file. No workflow publishes its
    # image, so it is built here from that branch at a pinned commit; building
    # downloads torch and the weights (about 1.5 GB). It publishes no port: the
    # api and celery containers reach it over this network, and no glyph crop
    # leaves the host.
    profiles: ["ml"]
    image: ${EMBEDDER_IMAGE:-archetype-embedder:cea0052}
    build: https://github.com/archetype-pal/backend.git#cea0052a8690de797307c9c881145152218d6b00:embedder
    restart: unless-stopped

  htr:
    # The self-hosted reader behind `htr_baseline --provider kraken` (AI
    # programme W1.4): Kraken finds a page's lines and CATMuS Medieval reads
    # them, the model pinned by its SHA-256 and baked in, run on CPU. Only a
    # build of the AI programme branch (archetype-pal/backend#202) calls it, so
    # it is opt-in: `docker compose --profile ml up -d htr`, then
    # ML_HTR_URL=http://htr:8080 in env_file. No workflow publishes its image,
    # so it is built here from that branch at a pinned commit; the image is
    # about 1.9 GB, most of it torch and Kraken. Reading a page peaks at about
    # 3.3 GB of memory. It publishes no port: the api and celery containers
    # reach it over this network, and no page leaves the host.
    #
    # It also finds a page's letters for `propose_letters` (W1.1), with two
    # models trained on the corpus's expert boxes. Those are not in the image:
    # they are read from storage/models/letters if they are there, and without
    # them only that answers 503. To train them here, on CPU (hours; no page
    # leaves the host):
    #   docker compose exec api python manage.py export_glyph_dataset --out storage/releases/<v> --release <v>
    #   docker compose exec api python manage.py export_letter_pages \
    #       --release storage/releases/<v> --out storage/letters-pages
    #   docker compose run --rm -v ./storage:/storage htr python train_letters.py \
    #       --release /storage/releases/<v> --pages /storage/letters-pages --out /storage/models/letters
    # then `docker compose restart htr`.
    profiles: ["ml"]
    image: ${HTR_IMAGE:-archetype-htr:46c841a}
    build: https://github.com/archetype-pal/backend.git#46c841ab7d432b382ef456beb55a22a93109cf5c:htr
    restart: unless-stopped
    volumes:
      - ./storage/models/letters:/models/letters:ro

  learn_prune:
    # Deletes the palaeography tutor's lessons (AI programme W4.4) older than
    # LEARN_RETENTION_DAYS, with the pictures they hold under storage/learn/,
    # closes lessons no worker will finish, and closes model calls and page
    # requests a killed worker left behind. Once an hour, in-process like
    # pg_backup below. Only a build of the AI programme branch
    # (archetype-pal/backend#202) has the commands, so it is opt-in:
    # `docker compose --profile learn up -d learn_prune`, or `--profile ml`.
    profiles: ["learn", "ml"]
    image: ${BACKEND_IMAGE:-ghcr.io/archetype-pal/backend:latest}
    env_file: env_file
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    command:
      - sh
      - -c
      - |
        sleep 60
        while true; do
          python manage.py prune_tutor_sessions || echo "[learn_prune] FAILED" >&2
          python manage.py close_abandoned_jobs || echo "[learn_prune] FAILED" >&2
          sleep 3600
        done
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Periodic logical backup of the application database. Runs in-process
  # (no host cron / no Kubernetes CronJob assumed) and writes compressed
  # dumps to a host-mounted `./backups/` directory so operators can pull
  # them off the box without entering the container.
  #
  # Retention: 14 days. Schedule: once every 24h after a one-minute warm-up
  # so a stack restart doesn't immediately re-dump.
  #
  # See infrastructure/docs/backup-runbook.md for restore steps and the
  # off-site copy policy.
  pg_backup:
    image: postgres:18-alpine
    env_file: env_file
    command:
      - sh
      - -c
      - |
        # pipefail: without it the pipeline's status is gzip's, so a failed
        # pg_dump would be renamed and logged as a good dump.
        set -eu -o pipefail
        sleep 60
        mkdir -p /backups
        while true; do
          ts="$$(date -u +%Y%m%dT%H%M%SZ)"
          out="/backups/local-$$ts.sql.gz"
          echo "[pg_backup] starting dump → $$out"
          if pg_dump "$$DATABASE_URL" | gzip > "$$out.partial"; then
            mv "$$out.partial" "$$out"
            echo "[pg_backup] OK $$(wc -c < "$$out") bytes"
          else
            echo "[pg_backup] FAILED — leaving $$out.partial for inspection" >&2
          fi
          # Failed partials age out with the dumps, so a sidecar that keeps
          # failing holds about two weeks of them, not an ever-growing pile.
          find /backups -name 'local-*.sql.gz*' -mtime +14 -delete
          sleep 86400
        done
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres18:
  logs:
  meilisearch_data:
  redis_data:
