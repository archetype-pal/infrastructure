name: archetype
services:
  meilisearch:
    image: getmeili/meilisearch:v1.45.2
    restart: ${RESTART}
    environment:
      # Meilisearch is no longer published on the host (see the missing `ports:`
      # below), so it's only reachable over the internal compose network. To
      # additionally require auth, set MEILI_ENV=production + a MEILI_MASTER_KEY
      # (>= 16 bytes) in env_file and give the Django client the same key. The
      # default stays `development` so an existing env_file (without these vars)
      # keeps working on deploy rather than refusing to start without a key.
      - MEILI_ENV=${MEILI_ENV}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      # Migrate the on-disk index format in place when the image is bumped to a
      # newer Meilisearch. Without this, a version mismatch makes the server
      # refuse to start. No-op when versions already match. Safe — no embedders.
      - MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE=true
    # No host `ports:` — Meilisearch is reachable only over the internal compose
    # network (the api/celery containers use http://meilisearch:7700). Exposing
    # it on the host would let anyone with network access read/write/delete every
    # index.
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    # Stay on the bookworm (glibc 2.36) base: the data dir's collation was
    # created with 2.36, and the trixie base (glibc 2.41) triggers a collation
    # version mismatch that would force a REINDEX. The postgres image isn't
    # CVE-scanned by CD, so a newer base buys nothing here.
    image: ${POSTGRES_IMAGE:-postgres:18.4-bookworm}
    restart: ${RESTART}
    volumes:
      # PostgreSQL 18 Docker images use versioned PGDATA under /var/lib/postgresql.
      # Keep the volume mounted at the parent so future major upgrades can use
      # the official versioned layout.
      - postgres18:/var/lib/postgresql
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=${PGDATA}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Pin to an immutable release tag (override BACKEND_IMAGE in env to roll
    # forward/back). Mutable :latest makes `docker compose pull` silently change
    # the running version and defeats digest-based rollback.
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - MEILISEARCH_URL=${MEILISEARCH_URL}
    env_file: .env
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The api image is minimal; use Python (always present) rather than
      # assuming curl/wget. Any HTTP response (even a 4xx HTTPError) from the
      # schema endpoint proves the WSGI app is up and routing; a connection
      # refusal (process not serving) raises URLError and fails the check.
      # urllib raises HTTPError on 4xx/5xx, so swallow it via contextlib.suppress.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,urllib.error,contextlib; exec(\"with contextlib.suppress(urllib.error.HTTPError): urllib.request.urlopen('http://localhost:80/api/v1/schema/', timeout=5)\")"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    # Run the baked image, pinned via env (override FRONTEND_IMAGE to roll
    # forward/back). The POSTGRES_PORTprevious prod stack shipped a mutable `:dev` tag AND
    # bind-mounted `../frontend:/app` over the image, coupling the running
    # container to the host's frontend checkout (and its node_modules). The
    # source bind-mount belongs in a dev override file, not here.
    image: ${FRONTEND_IMAGE}
    restart: ${RESTART}
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_IIIF_UPSTREAM=${NEXT_PUBLIC_IIIF_UPSTREAM}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - DOCKER_IMAGE_HASH=${DOCKER_IMAGE_HASH}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1, not localhost: the container resolves "localhost" to
      # ::1 first, but Next.js (HOSTNAME=0.0.0.0 in the Dockerfile) only binds
      # IPv4, so a localhost healthcheck fails with connection refused even
      # though the app is up — which then makes Traefik treat the backend as
      # down and stop routing to it.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  image_server:
    image: daschswiss/sipi:v5.0.1
    restart: ${RESTART}
    user: "14:50"
    # SIPI's Lua config reads these via os.getenv(): override the stock demo
    # jwt_secret / admin credentials and the production loglevel. Leaving them
    # unset falls back to the vendored demo values (still denied at the nginx
    # proxy). See .env.prod.sample.
    environment:
      - SIPI_JWT_SECRET=${SIPI_JWT_SECRET:-}
      - SIPI_ADMIN_USER=${SIPI_ADMIN_USER:-}
      - SIPI_ADMIN_PASSWORD=${SIPI_ADMIN_PASSWORD:-}
      - SIPI_LOGLEVEL=${SIPI_LOGLEVEL:-}
    # No host `ports:` — SIPI is reached only via nginx (`location /sipi`) and the
    # internal compose network. Publishing 1024 on the host bypasses the +
    # route-denial that blocks SIPI's control routes (/api/exit, /api/upload, ...).
#    expose: TODO remove
#      - "1024"
    volumes:
      - ./storage/media:/sipi/images
      - ./sipi-config/sipi.config.lua:/sipi/config/sipi.config.lua:ro
      - ./sipi-config/sipi.init.lua:/sipi/config/sipi.init.lua:ro
    healthcheck:
      # The daschswiss/sipi image ships no shell and no curl/wget (only tini +
      # the sipi binary), so any CMD-SHELL/CMD exec-based check fails at the
      # "exec /bin/sh" step regardless of whether SIPI itself is up — verified
      # via `docker inspect` OCI runtime errors. No other service depends_on
      # this one with condition: service_healthy, so disabling the check
      # doesn't affect startup ordering.
      test: ["NONE"]

  redis:
    image: redis:8-alpine
    restart: ${RESTART}
    # Require a password (set REDIS_PASSWORD in .env). No host `ports:` —
    # Redis is reachable only over the internal compose network by api/celery.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file: .env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 30s
      retries: 50

  celery:
    image: ${BACKEND_IMAGE:-ghcr.io/archetype-pal/backend:latest}
    restart: ${RESTART}
    command: celery -A config worker -l info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    env_file: .env
    environment:
      # Redis now requires a password; include it in the broker/result URLs.
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MEILISEARCH_URL=${MEILISEARCH_URL}
    # `inspect ping` is Celery's canonical liveness probe — it round-trips
    # through the broker and the worker's mingle queue, so a green check
    # means "worker is consuming tasks", not just "process exists". `-d`
    # targets THIS container's worker name; `$$HOSTNAME` is escaped so
    # docker-compose passes a literal `$HOSTNAME` for the shell to expand
    # inside the container.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Periodic logical backup of the application database. Runs in-process
  # (no host cron / no Kubernetes CronJob assumed) and writes compressed
  # dumps to a host-mounted `./backups/` directory so operators can pull
  # them off the box without entering the container.
  #
  # Retention: 14 days. Schedule: once every 24h after a one-minute warm-up
  # so a stack restart doesn't immediately re-dump.
  #
  # See infrastructure/docs/backup-runbook.md for restore steps and the
  # off-site copy policy.
  pg_backup:
    image: postgres:18-alpine
    env_file: .env
    command:
      - sh
      - -c
      - |
        set -eu
        sleep 60
        mkdir -p /backups
        while true; do
          ts="$$(date -u +%Y%m%dT%H%M%SZ)"
          out="/backups/local-$$ts.sql.gz"
          echo "[pg_backup] starting dump → $$out"
          if pg_dump "$$DATABASE_URL" | gzip > "$$out.partial"; then
            mv "$$out.partial" "$$out"
            echo "[pg_backup] OK $$(wc -c < "$$out") bytes"
          else
            echo "[pg_backup] FAILED — leaving .partial for inspection" >&2
            rm -f "$$out.partial" || true
          fi
          find /backups -name 'local-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres18:
  logs:
  meilisearch_data:
  redis_data:
