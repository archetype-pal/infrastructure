# The AI preview, ai.archetype-pal.ink: a build of the AI programme branches
# beside beta on the same host. See docs/preview-deployment.md.
#
# It runs its own api, workers, frontend, nginx and tunnel, and borrows beta's
# postgres, redis, meilisearch and image_server over beta's compose network,
# with its own database, redis numbers and index prefix (scripts/preview-init.sh).
#
# Services are named ai-* because every service answers to its name on each
# network it joins. A service called `api` on beta's network would answer for
# beta's api, and beta's nginx would send visitors to it at random.
name: archetype-ai

x-backend: &backend
  image: ${BACKEND_IMAGE:-ghcr.io/archetype-pal/backend:ai-preview}
  restart: unless-stopped
  env_file: env_file
  networks: [default, beta]
  volumes:
    - ./storage:/app/storage
    # Read-only: the files belong to beta. Deleting an image here must not take
    # beta's copy with it, so uploads fail on the preview.
    - ${MEDIA_HOST_PATH:?set MEDIA_HOST_PATH in .env}:/app/storage/media:ro

x-worker-environment: &worker-environment
  MEILISEARCH_URL: http://meilisearch:7700
  IIIF_INTERNAL_HOST: http://image_server:1024/sipi
  UPLOADS_SIPI_BASE_URL: http://image_server:1024/sipi

services:
  ai-api:
    <<: *backend
    mem_limit: 1g
    environment:
      <<: *worker-environment
      DJANGO_SETTINGS_MODULE: config.settings
      DRF_NUM_PROXIES: "1"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,urllib.error,contextlib; exec(\"with contextlib.suppress(urllib.error.HTTPError): urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:80/api/v1/schema/', headers={'X-Forwarded-Proto': 'https'}), timeout=5)\")"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ai-celery:
    <<: *backend
    mem_limit: 1g
    command: celery -A config worker -l info -c 2 -n ai@%h
    environment: *worker-environment

  # The tutor's lessons take minutes each, so they have their own queue.
  ai-celery-learn:
    <<: *backend
    mem_limit: 1g
    command: celery -A config worker -l info -Q learn -c 2 -n ai-learn@%h
    environment: *worker-environment

  ai-prune:
    <<: *backend
    mem_limit: 256m
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    command:
      - sh
      - -c
      - |
        sleep 60
        while true; do
          python manage.py prune_tutor_sessions || echo "[ai-prune] FAILED" >&2
          python manage.py close_abandoned_jobs || echo "[ai-prune] FAILED" >&2
          sleep 3600
        done

  ai-frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/archetype-pal/frontend:ai-preview}
    restart: unless-stopped
    mem_limit: 768m
    env_file: env_file
    depends_on:
      ai-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai-nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    env_file: env_file
    # On beta's network only for image_server: nginx.preview.conf names ai-api
    # and ai-frontend, so it cannot reach beta's api or frontend by accident.
    networks: [default, beta]
    volumes:
      - ./nginx.preview.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx-entrypoint.sh:/docker-entrypoint.d/nginx-entrypoint.sh:ro
      - ${MEDIA_HOST_PATH:?set MEDIA_HOST_PATH in .env}:/srv/media:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.d/nginx-entrypoint.sh"]
    depends_on:
      ai-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1/ 2>&1 | grep -q 'HTTP/'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Its own tunnel, so beta's tunnel and nginx need no change for this hostname.
  ai-cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
      - --credentials-file
      - /etc/cloudflared/credentials.json
      - --url
      - http://ai-nginx:80
      - ${CLOUDFLARE_TUNNEL_ID:?set CLOUDFLARE_TUNNEL_ID in .env}
    volumes:
      - ${CLOUDFLARE_CREDENTIALS_FILE:?set CLOUDFLARE_CREDENTIALS_FILE in .env}:/etc/cloudflared/credentials.json:ro
    depends_on:
      ai-nginx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  beta:
    external: true
    name: archetype_default
